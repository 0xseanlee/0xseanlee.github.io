<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>關於我 | 0xseanlee</title>
    <meta name="description" content="了解更多關於 0xseanlee 的背景、興趣與技術專長。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Fira Code', 'Noto Sans TC', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .pro-card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; transition: all .3s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-900">
    <header class="w-full bg-white border-b border-slate-200 px-6 py-3 text-xs flex justify-between items-center text-slate-600 font-mono">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <a href="/" class="hover:text-blue-600 transition-colors">← 返回首頁</a>
        </div>
        <div class="font-medium text-slate-500">ABOUT ME</div>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-12 flex-grow w-full">
        <section class="text-center mb-12" data-aos="fade-down">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-3">關於我</h1>
            <p id="about-purpose" class="text-sm text-slate-600 max-w-lg mx-auto leading-relaxed">載入中...</p>
        </section>

        <div id="about-container" class="space-y-6" data-aos="fade-up">
            <div class="text-xs font-mono text-slate-400 text-center py-8">
                <i class="fas fa-circle-notch animate-spin mr-2"></i>載入個人檔案中...
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-6 border-t border-slate-200 bg-white text-xs text-slate-500 font-mono">
        <p>© 2026 0xseanlee. All rights reserved.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true });

        async function loadAboutData() {
            try {
                const response = await fetch('../about.json');
                if (!response.ok) throw new Error('無法取得檔案');
                const data = await response.json();

                document.getElementById('about-purpose').textContent = data.purpose;

                const container = document.getElementById('about-container');
                container.innerHTML = `
                    <div class="pro-card p-6 space-y-4">
                        <h2 class="text-sm font-bold text-slate-900 font-mono border-b border-slate-100 pb-3 flex items-center gap-2">
                            <i class="fas fa-user text-blue-600"></i> 基本背景
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                            <div><span class="text-slate-400 font-mono">身分：</span><span class="font-medium text-slate-800">${data.identity}</span></div>
                            <div><span class="text-slate-400 font-mono">地區：</span><span class="font-medium text-slate-800">${data.location}</span></div>
                            <div><span class="text-slate-400 font-mono">語言：</span><span class="font-medium text-slate-800">${data.languages.join('、')}</span></div>
                            <div><span class="text-slate-400 font-mono">主修/方向：</span><span class="font-medium text-slate-800">${data.focus}</span></div>
                        </div>
                    </div>

                    <div class="pro-card p-6 space-y-4">
                        <h2 class="text-sm font-bold text-slate-900 font-mono border-b border-slate-100 pb-3 flex items-center gap-2">
                            <i class="fas fa-heart text-blue-600"></i> 興趣與喜好
                        </h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                            <div><span class="text-slate-400 font-mono">日常興趣：</span><span class="font-medium text-slate-800">${data.interests.join('、')}</span></div>
                            <div><span class="text-slate-400 font-mono">喜愛音樂：</span><span class="font-medium text-slate-800">${data.preferences.music}</span></div>
                            <div><span class="text-slate-400 font-mono">吸收新知：</span><span class="font-medium text-slate-800">${data.preferences.learning}</span></div>
                            <div><span class="text-slate-400 font-mono">個性風格：</span><span class="font-medium text-slate-800">${data.personality}</span></div>
                        </div>
                    </div>

                    <div class="pro-card p-6 space-y-4">
                        <h2 class="text-sm font-bold text-slate-900 font-mono border-b border-slate-100 pb-3 flex items-center gap-2">
                            <i class="fas fa-paper-plane text-blue-600"></i> 聯絡方式
                        </h2>
                        <div class="text-xs space-y-2">
                            <div><span class="text-slate-400 font-mono">最佳管道：</span><span class="font-medium text-slate-800">${data.contact.platform} (${data.contact.email})</span></div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error(error);
                document.getElementById('about-container').innerHTML = `<div class="text-xs font-mono text-red-500 text-center">[ERROR]: 無法載入關於頁面資料</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadAboutData);
    </script>
</body>
</html>
