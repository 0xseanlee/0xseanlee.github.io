<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="google-site-verification" content="ewtIfo-nwhcsCEggex9vgjKmF7HLATN2PJ1616JP-zg"/><title>0xseanlee | 個人作品集與技術展示</title><meta name="description" content="0xseanlee 的個人官方網站，集中展示前端網頁開發、自動化腳本與各項數位工具專案。"><meta name="keywords" content="0xsean, 0xseanlee, seanlee, 網頁開發, 前端工程, 自動化腳本, 作品集"><meta name="author" content="0xseanlee"><meta property="og:title" content="0xseanlee | Portfolio & Projects"><meta property="og:description" content="歡迎來到 0xseanlee 的個人作品集與技術專案展示網站。"><meta property="og:type" content="website"><meta property="og:url" content="https://0xseanlee.github.io/"><meta property="og:site_name" content="0xseanlee 官方網站"><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><style>@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap');body{font-family:'Fira Code','Noto Sans TC',sans-serif;background-color:#f8fafc;color:#1e293b}.pro-card{background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;transition:all .3s ease}.pro-card:hover{transform:translateY(-3px);border-color:#3b82f6;box-shadow:0 10px 25px -5px rgba(59,130,246,0.1)}::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#f8fafc}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#94a3b8}</style></head><body class="min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-900"><header class="w-full bg-white border-b border-slate-200 px-6 py-3 text-xs flex justify-between items-center text-slate-600 font-mono"><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> <span>STATUS: ONLINE</span> <span class="opacity-30">|</span> <span>0xseanlee Portfolio</span></div><div class="font-medium text-slate-500">v1.2.0</div></header><main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full"><section class="text-center mb-16 pt-4"><div class="inline-block p-1 rounded-full bg-white border border-slate-200 shadow-sm mb-6" data-aos="zoom-in"><img src="https://github.com/0xseanlee.png" alt="0xseanlee" class="w-24 h-24 rounded-full object-cover"></div><h1 class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900 mb-2" data-aos="fade-down">0xseanlee</h1><p class="text-xs text-slate-500 font-semibold tracking-widest uppercase font-mono mb-6">Software Development & Automation</p><div class="inline-block" data-aos="fade-up" data-aos-delay="100"><a href="mailto:0xseanlee@gmail.com" class="text-xs bg-slate-900 text-white font-medium px-4 py-2.5 rounded-lg flex items-center gap-2 hover:bg-slate-800 transition-colors font-mono"><i class="fas fa-envelope text-xs"></i> <span>0xseanlee@gmail.com</span></a></div></section><section class="mb-12" data-aos="fade-up"><h2 class="text-sm font-bold tracking-wider text-slate-900 uppercase border-b border-slate-200 pb-3 mb-6 font-mono flex items-center gap-2"><i class="fas fa-link text-blue-600"></i> 聯絡管道與社群連結</h2><div id="socials-container" class="grid grid-cols-1 sm:grid-cols-3 gap-4"><div class="text-xs font-mono text-slate-400 py-4"><i class="fas fa-circle-notch animate-spin mr-2"></i>Loading socials...</div></div></section><section class="mb-12"><h2 class="text-sm font-bold tracking-wider text-slate-900 uppercase border-b border-slate-200 pb-3 mb-6 font-mono flex items-center gap-2" data-aos="fade-right"><i class="fas fa-cubes text-blue-600"></i> 專案與作品展示</h2><div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="text-xs font-mono text-slate-400 py-4"><i class="fas fa-circle-notch animate-spin mr-2"></i>Loading projects...</div></div></section></main><footer class="w-full text-center py-6 border-t border-slate-200 bg-white text-xs text-slate-500 font-mono"><p>© 2026 0xseanlee. All rights reserved.</p></footer><script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script><script>function initAOS(){AOS.init({once:!0,mirror:!1})}async function loadSocials(){const e=document.getElementById("socials-container");try{const t=await fetch("./socials.json");if(!t.ok)throw new Error("Network response was not ok");const o=(await t.json()).filter(e=>!e._comment);let n="";o.forEach((e,t)=>{const o=e.isExternal?'target="_blank"':"",r=100*(t+1);n+=`<a href="${e.url}" ${o} class="pro-card p-4 flex items-center justify-between group" data-aos="fade-up" data-aos-delay="${r}"><div class="flex items-center space-x-3"><i class="${e.icon||"fas fa-globe"} text-lg text-slate-600 group-hover:text-blue-600 transition-colors"></i><span class="font-bold text-xs text-slate-800">${e.title}</span></div><i class="fas fa-arrow-up-right-from-square text-[10px] text-slate-400 group-hover:text-blue-600 transition-colors"></i></a>`}),e.innerHTML=n}catch(t){console.error("Error fetching socials:",t),e.innerHTML=`<div class="text-xs font-mono text-red-500">[ERROR]: Failed to load socials</div>`}}async function loadProjects(){const e=document.getElementById("projects-container");try{const t=await fetch("./app.json");if(!t.ok)throw new Error("Network response was not ok");const o=(await t.json()).filter(e=>!e._comment);let n="";o.forEach((e,t)=>{const o=e.isExternal?'target="_blank"':"",r=100*(t+1);n+=`<div class="pro-card p-6 flex flex-col justify-between" data-aos="fade-up" data-aos-delay="${r}"><div><div class="flex justify-between items-center mb-3"><span class="text-[10px] bg-blue-50 text-blue-700 font-bold px-2.5 py-1 rounded font-mono">${e.tag}</span><span class="text-xs text-slate-400 font-mono">${e.version}</span></div><h3 class="text-base font-bold text-slate-900 mb-2">${e.title}</h3><p class="text-slate-600 text-xs leading-relaxed mb-6">${e.description}</p></div><a href="${e.url}" ${o} class="inline-flex items-center text-xs font-medium text-blue-600 hover:text-blue-800 font-mono">View Project <i class="fas fa-chevron-right text-[10px] ml-1"></i></a></div>`}),e.innerHTML=n}catch(t){console.error("Error fetching projects:",t),e.innerHTML=`<div class="text-xs font-mono text-red-500">[ERROR]: Failed to load projects</div>` capture}}window.addEventListener("DOMContentLoaded",()=>{loadSocials(),loadProjects(),initAOS()});</script></body></html>
